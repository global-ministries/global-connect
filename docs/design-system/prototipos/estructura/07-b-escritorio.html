/* ── Base ── */
* { box-sizing: border-box; }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 8px; padding: 0 4px; }
.sec-h h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }

/* Attention metrics (MetricasAtencion) */
.attention { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.metric { min-width: 0; display: grid; gap: 6px; padding: 12px; text-align: left; cursor: pointer; border-radius: var(--radius-2xl); border: 1px solid transparent; background: var(--card); transition: background-color var(--duration-fast) var(--ease-expo), border-color var(--duration-fast) var(--ease-expo); }

.metric .bar, .metric .s { display: none; }
.bar { height: 4px; border-radius: 9999px; background: var(--muted); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); transition: width 500ms var(--ease-out-quint); }
.metric .s { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Status dot (PuntoEstado) */
.estado { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted-foreground); white-space: nowrap; }
.d { width: 8px; height: 8px; flex: none; display: inline-block; border-radius: 9999px; background: var(--c); box-shadow: 0 0 0 4px color-mix(in oklab, var(--c) 20%, transparent); }
[data-t="success"] { --c: var(--success); } [data-t="warning"] { --c: var(--warning); } [data-t="info"] { --c: var(--info); }
[data-t="danger"] { --c: var(--danger); } [data-t="muted"] { --c: var(--muted-foreground); }
[data-t="faint"] { --c: color-mix(in oklab, var(--muted-foreground) 50%, transparent); }

/* Tags (status badges on surfaces) */
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 9999px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--muted-foreground); }
.tag.warn { color: var(--warning-text); border-color: color-mix(in oklab, var(--warning) 40%, transparent); background: color-mix(in oklab, var(--warning) var(--tinte-estado), transparent); }
.tag.info { color: var(--info-text); border-color: color-mix(in oklab, var(--info) 40%, transparent); background: color-mix(in oklab, var(--info) var(--tinte-estado), transparent); }

/* Scope (phone: inset grouped list) */
.scope { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: var(--radius-2xl); overflow: hidden; }
.scope li { position: relative; }
.scope li + li::before { content: ''; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: color-mix(in oklab, var(--border) 60%, transparent); }
.node { width: 100%; min-height: 64px; display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; align-items: center; gap: 4px 10px; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.node:active { background: var(--accent); }
.node:focus-visible { outline-offset: -2px; }
.node .n-top { display: contents; }
.n-txt { grid-column: 1; grid-row: 1; min-width: 0; }
.n-name { display: block; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.n-n { font-size: 17px; font-weight: 500; color: var(--muted-foreground); }
.n-u { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

.link { flex: none; min-height: 44px; padding: 0 4px; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; white-space: nowrap; }

.who .txt { min-width: 0; }

.sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; font-size: 13px; color: var(--muted-foreground); min-width: 0; }
.svcs { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.svc { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; height: 30px; padding: 0 10px; border-radius: var(--radius-xl); background: var(--background); border: 1px solid color-mix(in oklab, var(--border) 60%, transparent); font-size: 13px; }
.svc .eq { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.svc .rol { color: var(--muted-foreground); white-space: nowrap; }
.svc.mas { color: var(--muted-foreground); }
.turno { font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.turno.none { color: var(--danger-text); }
.vacio { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 56px 20px; text-align: center; }
.vacio svg.i { width: 40px; height: 40px; color: color-mix(in oklab, var(--muted-foreground) 40%, transparent); }
.vacio p { margin: 0; max-width: 28rem; }
.vacio .t { font-size: 16px; font-weight: 600; }
.vacio .s { margin-top: 6px; font-size: 14px; color: var(--muted-foreground); }
.skel { display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 16px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); }
.skel:last-child { border-bottom: 0; }
.skel span { display: block; background: var(--muted); border-radius: var(--radius-md); animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
.skel .a { width: 40px; height: 40px; border-radius: 9999px; flex: none; }
.skel .l { flex: 1; display: grid; gap: 8px; animation: none; background: none; }
.skel .l span:first-child { width: 40%; height: 14px; } .skel .l span:last-child { width: 60%; height: 12px; }
.foot { display: flex; justify-content: center; gap: 8px; padding: 0 4px; font-size: 13px; color: var(--muted-foreground); }
.foot .orden { display: none; }
.people { display: grid; gap: 10px; min-width: 0; }

/* Tab bar + FAB (MenuInferiorMovil, BotonFlotante) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px max(8px, env(safe-area-inset-bottom, 0px)); background: color-mix(in oklab, var(--background) 72%, transparent); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border-top: 1px solid var(--border); }
.tabbar a { min-width: 0; min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 4px; padding: 6px 0; border-radius: var(--radius-xl); color: var(--muted-foreground); text-decoration: none; font-size: 12px; font-weight: 500; }
.tabbar a span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabbar a[aria-current="page"] { color: var(--brand-text); font-weight: 600; }
.tabbar svg.i { width: 24px; height: 24px; }
.fab { position: fixed; right: 16px; bottom: 88px; z-index: 45; width: 56px; height: 56px; display: grid; place-items: center; border: 0; border-radius: 9999px; background: var(--brand-strong); color: var(--brand-primary-foreground); box-shadow: var(--shadow-fab); cursor: pointer; transition: transform var(--duration-fast) var(--ease-expo), background-color var(--duration-fast) var(--ease-expo); }
.fab:hover { background: var(--brand-strong-hover); }
.fab:active { transform: scale(.97); }
.fab svg.i { width: 24px; height: 24px; }

/* Overlays (HojaInferior below md, PanelLateralSistema from md) */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity var(--duration-normal) var(--ease-out-quint); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; max-height: 90vh; display: flex; flex-direction: column; background: var(--card); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); transform: translateY(105%); visibility: hidden; transition: transform var(--duration-slow) var(--ease-out-quint), visibility 0s linear var(--duration-slow); }
.sheet.on { transform: none; visibility: visible; transition-delay: 0s; }
.sheet:focus { outline: none; }
.grab { display: block; flex: none; width: 38px; height: 5px; margin: 8px auto 0; border-radius: 9999px; background: var(--border); }
.sh-head { position: relative; display: grid; gap: 16px; padding: 12px 18px 16px; border-bottom: 1px solid var(--border); }
.sh-head h2 { margin: 0; padding-right: 48px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.sh-close { position: absolute; top: 4px; right: 8px; }
.sh-body { container-type: inline-size; flex: 1; min-height: 0; overflow: auto; display: grid; gap: 18px; align-content: start; padding: 16px 18px max(12px, env(safe-area-inset-bottom, 0px)); }
.sh-foot { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; padding: 12px 18px max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: inherit; }
.idrow { display: flex; gap: 14px; align-items: center; padding-right: 48px; }
.idrow .avatar { width: 56px; height: 56px; border-radius: var(--radius-xl); font-size: 18px; }
.idrow h2 { padding-right: 0; font-size: 20px; letter-spacing: -.02em; }
.idrow .meta { margin-top: 4px; font-size: 14px; color: var(--muted-foreground); }
.quick { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.quick .btn { flex-direction: column; gap: 6px; min-height: 66px; padding: 0 8px; font-size: 13px; }
.motivo { margin: -8px 0 0; font-size: 13px; color: var(--muted-foreground); }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--radius-xl); border: 1px solid color-mix(in oklab, var(--warning) 40%, transparent); background: color-mix(in oklab, var(--warning) var(--tinte-estado), transparent); font-size: 14px; }
.callout > svg.i { color: var(--warning-text); margin-top: 1px; }
.callout b { font-weight: 600; }
.callout p { margin: 2px 0 0; color: var(--muted-foreground); }
.callout .btn { margin-top: 10px; }
.nota { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.sh-sec { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }
.s-card { display: grid; gap: 12px; padding: 14px; border-radius: var(--radius-xl); border: 1px solid var(--border); background: var(--background); }
.s-card .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.s-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
.s-card .ruta { margin-top: 2px; font-size: 12px; color: var(--muted-foreground); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.kv div { display: grid; gap: 4px; min-width: 0; }
.kv dt { font-size: 12px; color: var(--muted-foreground); }
.kv dd { margin: 0; font-size: 13px; font-weight: 500; }
.kv .none { color: var(--danger-text); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts .btn { font-size: 14px; padding: 0 14px; }
.group { display: grid; gap: 10px; border: 0; margin: 0; padding: 0; min-width: 0; }
.group legend, .group > .g-t { padding: 0; margin-bottom: 10px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 9999px; border: 1.5px solid var(--border); background: none; color: var(--muted-foreground); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color var(--duration-fast) var(--ease-expo), color var(--duration-fast) var(--ease-expo); }
.pill:hover { background: var(--accent); color: var(--foreground); }
.pill b { font-weight: 600; color: var(--foreground); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pill[aria-pressed="true"] { border-color: var(--brand-primary); background: var(--brand-accent-strong); color: var(--foreground); }
.selects { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.campo { display: grid; gap: 8px; min-width: 0; }
.campo label { font-size: 14px; font-weight: 500; }
.campo .sel { position: relative; }
.campo select { width: 100%; height: 44px; padding: 0 40px 0 12px; border-radius: var(--radius-xl); border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 50%, transparent); color: var(--foreground); font-size: 16px; appearance: none; cursor: pointer; }
.campo select:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 2px color-mix(in oklab, var(--brand-primary) 20%, transparent); }
.campo select:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
.campo .sel svg { position: absolute; right: 12px; top: 13px; width: 16px; height: 16px; color: var(--muted-foreground); pointer-events: none; }
.campo option { background: var(--card); color: var(--foreground); }

/* Prototype options: not part of the design */
/* Phone: the options sit after the list, in the page flow, so they never cover rows; the bottom
   margin clears the tab bar and the FAB. From md up they float in the sidebar corner. */
.opciones { position: relative; margin: 0 16px calc(160px + env(safe-area-inset-bottom, 0px)); padding-top: 16px; border-top: 1px dashed var(--border); font-size: 13px; }
.opciones summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 9999px; border: 1px dashed var(--border); background: var(--card); color: var(--muted-foreground); cursor: pointer; }
.opciones summary::-webkit-details-marker { display: none; }
.opciones[open] summary { color: var(--foreground); }
.opciones .panel { position: static; left: 0; bottom: 52px; margin-top: 8px; display: grid; gap: 12px; padding: 14px; border-radius: var(--radius-xl); border: 1px dashed var(--border); background: var(--card); }
.opciones .panel p { margin: 0; font-size: 12px; color: var(--muted-foreground); }
.opciones .fila-op { display: grid; gap: 6px; }
.opciones .fila-op > span { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }
.opciones .seg { justify-self: start; }

/* ── Tablet (768–1023) ── */
@media (min-width: 768px) {
  body { background: var(--surface-primary); }
  .navbar, .large, .tabbar, .fab, .movil { display: none !important; }
  .app { display: grid; grid-template-columns: 64px minmax(0, 1fr); min-height: 100vh; }
  .content { min-width: 0; display: flex; flex-direction: column; }
  .header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 24px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); background: color-mix(in oklab, var(--surface-primary) 85%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .crumbs { flex: 1; min-width: 0; overflow: hidden; }
  .crumbs ol { display: flex; align-items: center; gap: 2px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
  .crumbs li { flex: 0 1 auto; display: flex; align-items: center; gap: 2px; min-width: 0; }
  .crumbs li:last-child { flex-shrink: 0; max-width: 45%; }
  .crumbs li + li::before { content: '/'; flex: none; padding: 0 4px; color: var(--muted-foreground); }
  .crumbs button { min-width: 0; max-width: 100%; min-height: 44px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs button:hover { background: var(--accent); color: var(--foreground); }
  .crumbs [aria-current="page"] { min-width: 0; padding: 0 8px; color: var(--foreground); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn.assign { position: relative; min-height: 36px; padding: 0 14px; gap: 6px; font-size: 14px; }
  .btn.assign svg.i { width: 16px; height: 16px; }
  .btn.assign::after { content: ''; position: absolute; inset: -6px -2px; }
  .me { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 9999px; background: none; cursor: pointer; }
  .me span { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9999px; background: var(--brand-accent-strong); border: 1px solid color-mix(in oklab, var(--brand-primary) 40%, transparent); font-size: 12px; font-weight: 600; color: var(--foreground); }
  main { padding: 32px 24px 120px; gap: 28px; }
  .hero { display: block; }
  .hero h1 { margin: 0; font-size: 24px; font-weight: 650; line-height: 1.15; letter-spacing: -.02em; }
  .hero p { margin-top: 6px; }
  .toolbar .desk { display: inline-flex; }
  .search { flex: 1 1 280px; min-height: 44px; padding: 0 14px; border-color: var(--border); background: color-mix(in oklab, var(--card) 50%, transparent); }
  .search input { height: 42px; }
  .search kbd { display: inline-block !important; }
  .sec-h { margin-bottom: 12px; padding: 0; }
  .sec-h .hint { display: block; }
  .attention { gap: 12px; }
  .metric { padding: 16px; gap: 10px; border-color: var(--border); }
  .metric[aria-pressed="true"] { border-color: var(--brand-primary); box-shadow: none; }
  .metric .v { font-size: 30px; }
  .metric .bar, .metric .s { display: block; }
  .scope { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; background: none; border-radius: 0; overflow: visible; }
  .scope li + li::before { display: none; }
  .node { height: 100%; display: grid; grid-template-columns: none; align-content: start; gap: 14px; padding: 16px; border-radius: var(--radius-2xl); border: 1px solid var(--border); background: var(--card); transition: background-color var(--duration-fast) var(--ease-expo), transform var(--duration-normal) var(--ease-out-quint); }
  .node:hover { background: var(--accent); transform: translateY(-1px); }
  .node:active { background: var(--accent); }
  .node:focus-visible { outline-offset: 2px; }
  .node .n-top { display: flex; justify-content: space-between; gap: 8px; }
  .n-txt, .n-go, .n-stats, .n-flags { grid-column: auto; grid-row: auto; }
  .n-name { font-size: 15px; font-weight: 600; white-space: normal; }
  .n-who { margin-top: 4px; }
  .n-stats { justify-self: start; display: flex; align-items: baseline; gap: 6px; }
  .n-n { font-size: 26px; font-weight: 600; line-height: 1; color: var(--foreground); }
  .n-u { position: static; width: auto; height: auto; overflow: visible; clip: auto; font-size: 13px; color: var(--muted-foreground); }
  .n-flags { min-height: 22px; }
  .n-flags:empty { display: flex; }
  .n-flags .tag.info { display: inline-flex; }
  .stack { display: flex; }
  .chips { flex-wrap: wrap; overflow: visible; padding: 0; }
  .lista { border: 1px solid color-mix(in oklab, var(--border) 60%, transparent); }
  .tabla { --cols: minmax(200px, 1.1fr) minmax(0, 2fr) 130px 28px; }
  .cab, .fila { display: grid; grid-template-columns: var(--cols); gap: 16px; align-items: center; padding: 0 18px; }
  .cab { min-height: 44px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground); }
  .cab [role="columnheader"] { display: flex; align-items: center; min-width: 0; }
  .cab button { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; margin: 0 -4px; padding: 0 4px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  .cab button:hover, .cab [aria-sort] button { color: var(--foreground); }
  .fila { min-height: 72px; padding-top: 12px; padding-bottom: 12px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); }
  .fila:last-child { border-bottom: 0; }
  .fila + .fila::before { display: none; }
  .fila:hover { background: color-mix(in oklab, var(--accent) 50%, transparent); }
  .fila:active { background: color-mix(in oklab, var(--accent) 50%, transparent); }
  .entrada .fila { animation: slide-up-fade 300ms var(--ease-expo) both; }
  .c-d { display: flex; align-items: center; min-width: 0; }
  .c-m { display: none; }
  .c-turno { display: none !important; }
  .avatar { border-radius: var(--radius-lg); }
  .foot { justify-content: space-between; }
  .foot .orden { display: inline; }
  .opciones { position: fixed; left: 10px; bottom: 12px; z-index: 50; margin: 0; padding: 0; border: 0; }
  .opciones summary { width: 44px; padding: 0; justify-content: center; }
  .opciones summary .lbl-op { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  .opciones .panel { position: absolute; width: 272px; margin: 0; box-shadow: var(--shadow-sheet); }
  .sheet { top: 0; left: auto; width: min(480px, 100%); max-height: none; border-radius: 0; border-left: 1px solid var(--border); background: var(--background); transform: translateX(105%); }
  .grab { display: none; }
  .sh-head { padding: 16px 24px; }
  .sh-close { top: 8px; right: 8px; }
  .sh-body { padding: 20px 24px; }
  .sh-foot { padding: 12px 24px; }
  .s-card { background: var(--card); }
  .kv { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@container (min-width: 560px) { .selects { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 768px) and (pointer: coarse) { .cab button { min-height: 44px; } }

/* ── Desktop (≥ 1024) ── */
@media (min-width: 1024px) {
  .app { grid-template-columns: 256px minmax(0, 1fr); }
  .header { padding: 0 48px; }
  main { padding: 32px 48px 120px; }
  .attention { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tabla { --cols: minmax(240px, 1.1fr) minmax(0, 2fr) 150px 130px 28px; }
  .opciones summary { width: auto; padding: 0 14px; }
  .opciones summary .lbl-op { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
  .c-turno { display: flex !important; }
}

/* App shell (design/app-shell): sidebar by sections, Dream Team group, header icons */
.sel { position: relative; }
.sel select { width: 100%; height: 44px; padding: 0 36px 0 40px; border-radius: var(--radius-xl); border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 50%, transparent); color: var(--foreground); font-size: 14px; font-weight: 500; appearance: none; cursor: pointer; }
.sel select:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; border-color: var(--brand-primary); }
.sel .ic { position: absolute; left: 12px; top: 13px; width: 18px; height: 18px; color: var(--muted-foreground); pointer-events: none; }
.sel .ch { position: absolute; right: 12px; top: 14px; width: 16px; height: 16px; color: var(--muted-foreground); pointer-events: none; }
.sel option { background: var(--card); color: var(--foreground); }
.sel.plain select { padding-left: 12px; font-size: 16px; }
.campana { position: relative; }
.campana .count { position: absolute; top: 3px; right: 1px; box-shadow: 0 0 0 2px var(--background); }
@media (min-width: 768px) {
  .app.rail { grid-template-columns: 64px minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; min-width: 0; padding: 18px 14px 12px; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); }
  .rail .side { padding: 16px 10px 12px; }
  .s-top { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .rail .s-top { flex-direction: column; align-items: stretch; gap: 4px; }
  .logo { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 44px; padding: 0 8px; font-weight: 700; font-size: 15px; }
  .rail .logo { justify-content: center; padding: 0; }
  .logo i { width: 28px; height: 28px; flex: none; border-radius: var(--radius-sm); background: var(--brand-primary); }
  .s-icon { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); cursor: pointer; transition: background-color var(--duration-fast) var(--ease-expo); }
  .s-icon:hover { background: var(--accent); color: var(--foreground); }
  .s-icon[aria-expanded="true"] { background: var(--accent); color: var(--foreground); }
  .s-campus { margin-bottom: 8px; }
  .s-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -14px; padding: 0 14px 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .rail .s-scroll { margin: 0 -10px; padding: 0 10px 8px; scrollbar-width: none; }
  .s-sec + .s-sec { margin-top: 4px; }
  .s-sec h2 { margin: 0; padding: 14px 10px 6px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
  .rail .s-sec h2 { height: 1px; margin: 10px 8px; padding: 0; overflow: hidden; background: var(--sidebar-border); color: transparent; }
  .s-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .it { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); font-size: 14px; text-align: left; text-decoration: none; cursor: pointer; transition: background-color var(--duration-fast) var(--ease-expo), color var(--duration-fast) var(--ease-expo); }
  .it:hover { background: var(--accent); color: var(--foreground); }
  .it[aria-current="page"] { background: var(--brand-accent-strong); color: var(--foreground); font-weight: 600; }

// ── Overlays: the detail panel, and a centered dialog that can sit on top of it (rename, confirm). Focus moves in,
// Tab stays inside the top one, Escape / scrim / close return focus to whatever opened it. ──
const FONDO = ['#app', '#tabbar', '#fab', '#opciones'];
const pila = [];
const abierto = () => pila.at(-1)?.el;
function show(el) {
  const sobre = el.id === 'dialogo' && $('#drawer').classList.contains('on');
  if (!sobre) while (pila.length) pila.pop().el.classList.remove('on');
  pila.push({ el, volver: document.activeElement });
  if (sobre) $('#drawer').inert = true;
  el.classList.add('on'); $('#scrim').classList.add('on');
  FONDO.forEach(s => $(s).inert = true);

  el.querySelector('.sh-body')?.scrollTo(0, 0);
  (el.querySelector('[autofocus]') || el).focus({ preventScroll: true });
}
function closeAll(volver = true) {

  top.el.classList.remove('on');
  if (pila.length) { $('#drawer').inert = false; renderDetalle(); }
  else { $('#scrim').classList.remove('on'); FONDO.forEach(s => $(s).inert = false); document.body.style.overflow = ''; if (top.el.id === 'drawer') { st.sel = null; VISTA.marcar?.(); } }
  // The trigger may have been re-rendered: find it again by its data attribute.
  let el = top.volver;
  if (el && !el.isConnected) { const k = [...el.attributes].find(a => a.name.startsWith('data-') || a.name === 'id'); el = k && document.querySelector(k.name === 'id' ? '#' + k.value : `[${k.name}="${CSS.escape(k.value)}"]`); }
  if (volver && el && el.offsetParent !== null) el.focus({ preventScroll: true });
  else if (pila.length) $('#d-name')?.focus({ preventScroll: true });
}
function focoDentro(e) {
  const d = abierto(); if (!d || e.key !== 'Tab') return;
  const f = [...d.querySelectorAll('button:not([disabled]), select, input:not([disabled]), [href], summary')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f.at(-1);
  if (e.shiftKey && (document.activeElement === first || document.activeElement === d)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
const cabeza = (titulo, meta = '') => `<span class="grab" aria-hidden="true"></span><div class="sh-head"><div><h2 id="d-name" tabindex="-1">${titulo}</h2>${meta ? `<p class="nota" style="margin-top:4px">${meta}</p>` : ''}</div><button type="button" class="btn icon ghost sh-close" data-close aria-label="Cerrar">${ICON.x}</button></div>`;

  if (st.loading) return renderCarga();
  if (st.tab === 'turnos') renderTurnos(); else VISTA.render(opts);
  if (opts.foco) (esEscritorio() ? $('#title') : $('#l-title'))?.focus({ preventScroll: true });
}
function renderCarga() {
  const sk = (w, h = 14) => `<span style="display:block;width:${w};height:${h}px;border-radius:var(--radius-md);background:var(--muted);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite"></span>`;
  $('#vista').innerHTML = `<div role="status" aria-busy="true" style="display:grid;gap:20px"><span class="sr">Cargando</span>${sk('100%', 44)}
    <div class="attention">${'<div class="metric" style="cursor:default">' + sk('50%') + sk('30%', 26) + '</div>'.repeat(1)}${('<div class="metric" style="cursor:default">' + sk('50%') + sk('30%', 26) + '</div>').repeat(3)}</div>
    <div class="lista">${'<div class="skel" aria-hidden="true"><span class="a"></span><span class="l"><span></span><span></span></span></div>'.repeat(6)}</div></div>`;
}

// ── Direction B · "Organigrama visual": the tree drawn as connected boxes (left to right on desktop, an indented chart
// with connectors on phone). Search and health pills highlight boxes without hiding the rest; a box opens the panel. ──
const CJ = { W: 256, H: 56, GX: 56, GY: 10 };
const VISTA = {
  id: 'b',
  // Desktop and phone open the direcciones; deeper branches start folded ("+n"). The first desktop render fits the zoom.
  inicio() { st.abiertos = new Set(raices().filter(n => (n.children || []).length && !n.gdv && n.activo).map(n => n.id)); st.zoom = 1; this.auto = true; },
  // A box is lit when it matches the search and the pressed health pill; with neither, every box is lit.
  activo() { return !!(st.filtro || st.q.trim()); },
  luce(n) { const q = norm(st.q.trim()); return (!st.filtro || problemas(n).includes(st.filtro)) && (!q || coincideQ(n, q)); },
  // Branches open: the folded state plus, while highlighting, the ancestors of every lit box.
  abiertos() { const s = new Set(st.abiertos); if (this.activo()) visibles().filter(n => this.luce(n)).forEach(n => n.path.forEach(id => s.add(id))); return s; },
  render(opts = {}) {
    const lit = visibles().filter(n => this.activo() && this.luce(n));
    const res = this.activo() ? `${plural(lit.length, 'equipo resaltado', 'equipos resaltados')}${lit.length ? '' : ' · probá con otra palabra'}` : '';
    if (opts.busqueda && $('#lz-cuerpo')) { $('#lz-cuerpo').innerHTML = this.cuerpo(); $('#lz-res').textContent = res; this.alPrimero(); return; }
    $('#vista').innerHTML = `<section class="lienzo" aria-labelledby="lz-h"><h2 class="sr" id="lz-h">Organigrama</h2>
      <div class="lz-barra">${buscador('Buscar en el organigrama')}${pastillasSalud(visibles(), 'Resaltar en el organigrama')}<span class="lz-res" id="lz-res" role="status">${res}</span></div>
      <div id="lz-cuerpo">${this.cuerpo()}</div></section>`;
    if (this.auto) requestAnimationFrame(() => this.reajustar());
    if (this.activo()) this.alPrimero();
  },
  // Until the user zooms by hand, the chart fits the canvas (on load and when the window changes size).
  reajustar() { if (!this.auto || !esEscritorio() || !$('#lz-vista') || st.tab !== 'equipos') return; const z = this.encaje(); if (z !== st.zoom) { st.zoom = z; $('#lz-cuerpo').innerHTML = this.cuerpo(); } },
  // The automatic fit never goes below 80 % (text stays readable); smaller is a manual choice.
  encaje() { const v = $('#lz-vista'), c = $('.lz-capa'); return Math.max(0.8, Math.min(1, Math.floor(Math.min((v.clientHeight - 100) / c.offsetHeight, (v.clientWidth - 52) / c.offsetWidth) * 20) / 20)); },
  cuerpo() { return esEscritorio() ? this.dibujo() : this.vertical(); },
  // Desktop: tidy left-to-right layout; the campus is the root box; a folded box shows "+n" and its branch health.
  dibujo() {
    const ab = this.abiertos(), cajas = [], lineas = [];
    let y = 0, maxX = 0;
    const colocar = (n, prof) => {
      const hijos = n.children || [], abierto = hijos.length && (n.raiz || ab.has(n.id));
      let top;
      if (!abierto) { top = y; y += CJ.H + CJ.GY; }
      else { const ys = hijos.map(h => colocar(h, prof + 1)); top = (ys[0] + ys.at(-1)) / 2; ys.forEach(yh => lineas.push([prof, top, yh])); }
      const x = prof * (CJ.W + CJ.GX); maxX = Math.max(maxX, x + CJ.W);
      cajas.push(this.caja(n, x, top, abierto));
      return top;
    };
    const raiz = { id: 'campus', raiz: true, label: 'Barquisimeto', children: raices() };
    colocar(raiz, 0);
    const alto = y - CJ.GY, z = st.zoom;
    const camino = ([p, y1, y2]) => { const x1 = p * (CJ.W + CJ.GX) + CJ.W, x2 = x1 + CJ.GX, xm = x1 + CJ.GX / 2, a = y1 + CJ.H / 2, b = y2 + CJ.H / 2, r = Math.min(8, Math.abs(b - a) / 2), s = Math.sign(b - a);
      return s ? `M${x1} ${a}H${xm - r}Q${xm} ${a} ${xm} ${a + r * s}V${b - r * s}Q${xm} ${b} ${xm + r} ${b}H${x2}` : `M${x1} ${a}H${x2}`; };
    return `<div class="lz-vista" id="lz-vista" tabindex="0" aria-label="Organigrama, desplazable con las flechas">
        <div class="lz-plano" style="width:${maxX * z}px;height:${alto * z}px"><div class="lz-capa" style="width:${maxX}px;height:${alto}px;transform:scale(${z})">
          <svg class="lz-lineas" width="${maxX}" height="${alto}" aria-hidden="true"><path d="${lineas.map(camino).join('')}"/></svg>${cajas.join('')}</div></div></div>
      <div class="lz-zoom" role="group" aria-label="Zoom y ramas">
        <button type="button" class="btn icon ghost" data-zoom="-1" aria-label="Alejar"${z <= 0.6 ? ' disabled' : ''}>${svg('<path d="M5 12h14"/>', 18)}</button><span class="num lz-pct" aria-live="polite">${Math.round(z * 100)} %</span><button type="button" class="btn icon ghost" data-zoom="1" aria-label="Acercar"${z >= 1.2 ? ' disabled' : ''}>${ICON.mas}</button>
        <span class="lz-sep" aria-hidden="true"></span><button type="button" class="btn sm ghost" data-ajustar>Ajustar</button><button type="button" class="btn sm ghost" data-todo="1">Expandir todo</button><button type="button" class="btn sm ghost" data-todo="0">Contraer</button></div>
      <ul class="leyenda lz-ley">${SALUD.filter(s => s.k !== 'inactivo').map(s => `<li><span class="d" data-t="${s.t}" aria-hidden="true"></span>${s.label}</li>`).join('')}<li><span class="cj-mini" aria-hidden="true"></span>Inactivo</li></ul>`;
  },
  caja(n, x, y, abierto) {
    if (n.raiz) { const c = raices().reduce((s, r) => s + rama(r.id), 0);
      return `<div class="cj-w" style="left:0;top:${y}px"><div class="caja raiz"><span class="avatar chico nodo" aria-hidden="true">${nav('campus')}</span><span class="cj-txt"><span class="cj-n">Barquisimeto</span><span class="cj-r">Dream Team · <span class="num">${c}</span> personas</span></span></div></div>`; }
    const lit = this.activo() && this.luce(n), dim = this.activo() && !lit, hijos = (n.children || []).length;
    const malRama = hijos && !abierto ? descendientes(n.id).some(d => problemas(d).some(k => k !== 'inactivo')) : false;
    const desc = `${n.label}, ${n.resp ? nombreCorto(n.resp.nombre) : 'sin responsable'}, ${personas(rama(n.id))}${problemas(n).length ? ', ' + problemas(n).map(k => salud(k).label).join(', ') : ''}${n.gdv ? ', solo lectura' : ''}`;
    return `<div class="cj-w" style="left:${x}px;top:${y}px"><button type="button" class="caja${n.activo ? '' : ' apagado'}${n.gdv ? ' gdv' : ''}${lit ? ' luce' : ''}${dim ? ' tenue' : ''}${st.sel === n.id ? ' sel' : ''}" data-abrir="${n.id}" data-id="${n.id}" aria-label="${esc(desc)}">
        <span class="avatar chico${n.resp ? '' : ' vacio-av'}" data-h="${n.resp ? tono(n.resp.nombre) : 1}" aria-hidden="true">${n.resp ? iniciales(n.resp.nombre) : '?'}</span>
        <span class="cj-txt"><span class="cj-n">${esc(n.label)}</span><span class="cj-r${n.resp ? '' : ' warning-t'}">${n.resp ? esc(nombreCorto(n.resp.nombre)) : n.activo ? 'Sin responsable' : 'Inactivo'}</span></span>
        <span class="cj-der" aria-hidden="true"><span class="num cj-c">${rama(n.id)}</span>${puntosSalud(n).replace(/<span class="sr">.*?<\/span>/, '')}</span></button>
      ${hijos ? `<button type="button" class="cj-tog${abierto ? '' : ' plegado'}" data-tog="${n.id}" aria-expanded="${!!abierto}" aria-label="${abierto ? 'Contraer' : `Expandir, ${plural(hijos, 'equipo', 'equipos')} dentro de`} ${esc(n.label)}${malRama ? ', con cosas por revisar' : ''}">${abierto ? svg('<path d="M6 12h12"/>', 14) : `<span class="num">+${hijos}</span>`}${malRama ? '<span class="d" data-t="warning" aria-hidden="true"></span>' : ''}</button>` : ''}</div>`;
  },
  // Phone: the chart turned vertical; each level indented on a connector rail, folded branches show "+n".
  vertical() {
    const ab = this.abiertos();
    const rama_ = nodos => `<ul class="ov">${nodos.map(n => { const hijos = n.children || [], abierto = hijos.length && ab.has(n.id), lit = this.activo() && this.luce(n), dim = this.activo() && !lit;
      return `<li><div class="ov-fila"><button type="button" class="ov-c${n.activo ? '' : ' apagado'}${n.gdv ? " gdv" : ""}${lit ? ' luce' : ''}${dim ? ' tenue' : ''}${st.sel === n.id ? ' sel' : ''}" data-abrir="${n.id}" data-id="${n.id}" aria-label="${esc(n.label)}, ${n.resp ? esc(nombreCorto(n.resp.nombre)) : 'sin responsable'}, ${personas(rama(n.id))}${problemas(n).length ? ', ' + problemas(n).map(k => salud(k).label).join(', ') : ''}">
          <span class="avatar chico${n.resp ? '' : ' vacio-av'}" data-h="${n.resp ? tono(n.resp.nombre) : 1}" aria-hidden="true">${n.resp ? iniciales(n.resp.nombre) : '?'}</span>
          <span class="cj-txt"><span class="cj-n">${esc(n.label)}</span><span class="cj-r${n.resp ? '' : ' warning-t'}">${n.resp ? esc(nombreCorto(n.resp.nombre)) : n.activo ? 'Sin responsable' : 'Inactivo'}</span></span>
          <span class="cj-der" aria-hidden="true"><span class="num cj-c">${rama(n.id)}</span>${puntosSalud(n).replace(/<span class="sr">.*?<\/span>/, '')}</span></button>
        ${hijos.length ? `<button type="button" class="ov-tog" data-tog="${n.id}" aria-expanded="${!!abierto}" aria-label="${abierto ? 'Contraer' : 'Expandir'} ${esc(n.label)}">${abierto ? '' : `<span class="num">+${hijos.length}</span>`}${ICON.chev}</button>` : ''}</div>
        ${abierto ? rama_(hijos) : ''}</li>`; }).join('')}</ul>`;
    const c = raices().reduce((s, r) => s + rama(r.id), 0);
    return `<div class="org-v"><div class="ov-raiz"><span class="avatar chico nodo" aria-hidden="true">${nav('campus')}</span><span><b>Barquisimeto</b><span class="t2">Dream Team · <span class="num">${c}</span> personas</span></span></div>${rama_(raices())}</div>
      <div class="acts ov-acts"><button type="button" class="link" data-todo="1">Expandir todo</button><button type="button" class="link" data-todo="0">Contraer todo</button></div>`;
  },
  alPrimero() { const b = document.querySelector('#lz-cuerpo .luce'); if (b) (b.closest('.cj-w') || b).scrollIntoView({ block: 'nearest', inline: 'nearest' }); },
  // The open node is always visible: its folded ancestors open, and the canvas scrolls to it.
  marcar() {
    if (st.sel && $('#lz-cuerpo') && !document.querySelector(`#lz-cuerpo [data-id="${st.sel}"]`)) { index[st.sel].path.forEach(id => st.abiertos.add(id)); $('#lz-cuerpo').innerHTML = this.cuerpo(); }
    document.querySelectorAll('#lz-cuerpo [data-id]').forEach(b => b.classList.toggle('sel', b.dataset.id === st.sel));
    const b = st.sel && document.querySelector(`#lz-cuerpo [data-id="${st.sel}"]`); if (b && esEscritorio()) b.closest('.cj-w').scrollIntoView({ block: 'nearest', inline: 'nearest' });
  },
  click(t, ds) {
    if (ds.tog) { st.abiertos.has(ds.tog) ? st.abiertos.delete(ds.tog) : st.abiertos.add(ds.tog); $('#lz-cuerpo').innerHTML = this.cuerpo(); return document.querySelector(`[data-tog="${ds.tog}"]`)?.focus(); }
    if (ds.todo) { st.abiertos = ds.todo === '1' ? new Set(visibles().filter(n => (n.children || []).length).map(n => n.id)) : new Set(); $('#lz-cuerpo').innerHTML = this.cuerpo(); return document.querySelector(`[data-todo="${ds.todo}"]`)?.focus(); }
    if (ds.zoom || ds.ajustar !== undefined) {
      this.auto = ds.ajustar !== undefined;
      st.zoom = ds.zoom ? Math.min(1.2, Math.max(0.6, Math.round((st.zoom + ds.zoom * 0.1) * 10) / 10)) : this.encaje();
      $('#lz-cuerpo').innerHTML = this.cuerpo(); return (document.querySelector(ds.zoom ? `[data-zoom="${ds.zoom}"]:not([disabled])` : '[data-ajustar]') || $('#lz-vista')).focus();
    }
  },
};
addEventListener('resize', () => VISTA.reajustar());
// Pan: drag the empty canvas (pointer), or scroll it with the arrows (it is a focusable scroll region).
let arrastre = null;
document.addEventListener('pointerdown', e => { const v = e.target.closest?.('#lz-vista'); if (!v || e.target.closest('button') || e.button !== 0) return; arrastre = { v, x: e.clientX, y: e.clientY, l: v.scrollLeft, t: v.scrollTop }; v.classList.add('arrastrando'); });
document.addEventListener('pointermove', e => { if (!arrastre) return; arrastre.v.scrollLeft = arrastre.l - (e.clientX - arrastre.x); arrastre.v.scrollTop = arrastre.t - (e.clientY - arrastre.y); });
document.addEventListener('pointerup', () => { if (arrastre) arrastre.v.classList.remove('arrastrando'); arrastre = null; });

// ── Events (shared). The direction gets the clicks it owns through VISTA.click. ──
const conEditor = id => { if (id) st.sel = id; };
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#"]'); if (a) e.preventDefault();
  const t = e.target.closest('button, a[data-ir], a[data-tab]'); if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.tema !== undefined) {
    document.querySelectorAll('[data-tema]').forEach(b => b.setAttribute('aria-pressed', b === t));
    if (ds.tema) document.documentElement.dataset.tema = ds.tema; else delete document.documentElement.dataset.tema;
    return;
  }
  if (t.id === 'op-carga') { st.loading = true; render(); setTimeout(() => { st.loading = false; render(); }, 1500); return; }
  if (ds.close !== undefined) return closeAll();
  if (ds.confirmar !== undefined) { index[st.sel].activo = false; closeAll(); return render(); }
  if (ds.activar !== undefined) { index[st.sel].activo = true; renderDetalle(); render(); return $('#d-name')?.focus(); }
  if (ds.abrir) return abrirDetalle(ds.abrir);
  if (ds.ptab) { st.ptab = ds.ptab; st.psub = ds.psub || null; renderDetalle(); $('#d-body').scrollTo(0, 0); return (st.psub ? $('#d-body button, #d-body input') : $('#pt-' + st.ptab))?.focus(); }
  if (ds.psub) { st.psub = ds.psub; renderDetalle(); return $('#d-body [data-turnos-volver]')?.focus(); }
  if (ds.turnosVolver !== undefined) { st.psub = null; renderDetalle(); return $('[data-psub="editar"]')?.focus(); }
  if (ds.nivelIr !== undefined) { st.tab = 'equipos'; st.nivel = ds.nivelIr || null; st.filtro = null; scrollTo(0, 0); return render({ foco: true }); }
  if (ds.filtro) { st.filtro = st.filtro === ds.filtro ? null : ds.filtro; VISTA.render(); return document.querySelector(`[data-filtro="${ds.filtro}"]`)?.focus(); }
  if (ds.limpiar !== undefined) { st.filtro = null; st.q = ''; VISTA.render(); return $('#q')?.focus(); }
  if (ds.tab) { st.tab = ds.tab; if (pila.length && ds.tab === 'turnos') while (pila.length) closeAll(false); render(); scrollTo(0, 0); return $('#tab-' + st.tab).focus(); }
  if (ds.renombrar !== undefined) { conEditor(ds.renombrar); return openNombre('renombrar'); }
  if (ds.sub !== undefined) { conEditor(ds.sub); return openNombre('sub'); }
  if (ds.desactivar !== undefined) return openConfirmar();
  if (ds.rolRenombrar) return openNombre('rol', ds.rolRenombrar);
  if (ds.turnoNuevo !== undefined) return openTurnoNuevo();
  if (ds.rol && t.getAttribute('role') === 'switch') { const r = index[st.sel].roles.find(x => x.id === ds.rol); r.activo = !r.activo; renderDetalle(); VISTA.render(); return document.querySelector(`#drawer [data-rol="${CSS.escape(ds.rol)}"]`)?.focus(); }
  if (ds.turno && t.getAttribute('role') === 'switch') { const x = turno(ds.turno); x.activo = !x.activo; render(); return document.querySelector(`[data-turno="${ds.turno}"]`)?.focus(); }
  VISTA.click?.(t, ds);
});
document.addEventListener('change', e => {
  if (e.target.id === 'op-rol') cambiarRol(e.target.value);
  if (e.target.id === 'tn-tipo') { closeAll(false); openTurnoNuevo(e.target.value); $('#tn-tipo').focus(); }
  if (e.target.dataset?.nivel) { const r = index[st.sel].roles.find(x => x.id === e.target.dataset.nivel); r.nivel = e.target.value; }
});
document.addEventListener('input', e => {
  if (e.target.dataset?.buscar === undefined) return;
  st.q = e.target.value; VISTA.render({ busqueda: true });
});
$('#scrim').addEventListener('click', () => closeAll());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (abierto()) { e.preventDefault(); closeAll(); } else if ($('#opciones').open) { $('#opciones').open = false; $('#opciones summary').focus(); } return; }
  if (e.key === '/' && !abierto() && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && $('#q')) { e.preventDefault(); return $('#q').focus(); }
  focoDentro(e);
  const tab = e.target.closest?.('[role=tablist]');
  if (tab && e.target.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight'].includes(e.key)) {
    const ts = [...tab.querySelectorAll('[role=tab]')], i = ts.indexOf(e.target), sig = ts[(i + (e.key === 'ArrowRight' ? 1 : ts.length - 1)) % ts.length];
    sig.click(); document.getElementById(sig.id)?.focus();
  }
  VISTA.tecla?.(e);
});
function cambiarRol(rol) {
  while (pila.length) closeAll(false);
  st.quien = rol; st.nivel = null; st.sel = null; st.q = ''; st.tab = 'equipos'; st.filtro = null;
  $('#op-rol').value = rol; VISTA.inicio?.(); renderShell(); render();
}
mqTablet.addEventListener('change', () => { renderShell(); render(); });
matchMedia('(min-width: 768px)').addEventListener('change', () => render());

// ── Start: initial state per artboard, then review links ──
const html = document.documentElement;
st.quien = html.dataset.rol || 'admin'; st.nivel = html.dataset.nivel || null; st.tab = html.dataset.tab || 'equipos';
$('#op-rol').value = st.quien;
VISTA.inicio?.(); renderShell(); render();
// Review links: #oscuro, #claro, #rol=<admin|director|sin>, #nivel=<id>, #nodo=<id>[, #ptab=<resumen|roles|turnos|taller>],
// #turnos-editar, #filtro=<resp|roles|turno|inactivo>, #buscar=<texto>, #turnos, #turno-nuevo[=fechas], #renombrar, #sub, #desactivar,
// #carga, #zoom=<n>, #abrir=<id>, #cerrar=<id>, #opciones
for (const k of decodeURIComponent(location.hash.slice(1)).split(',').filter(Boolean)) {
  const [c, v] = k.split('=');
  if (c === 'oscuro' || c === 'claro') document.querySelector(`[data-tema="${c}"]`).click();
  if (c === 'rol' && VISTAS[v]) cambiarRol(v);
  if (c === 'nivel') { st.nivel = index[v] ? v : null; render(); }
  if (c === 'filtro') { st.filtro = v; render(); }
  if (c === 'buscar') { st.q = v; render(); }
  if (c === 'zoom') { st.zoom = +v; VISTA.auto = false; render(); }
  if (c === 'abrir' && index[v]) { st.abiertos.add(v); render(); }
  if (c === 'cerrar' && index[v]) { st.abiertos.delete(v); render(); }
  if (c === 'turnos') { st.tab = 'turnos'; render(); }
  if (c === 'carga') { st.loading = true; render(); }
  if (c === 'nodo' && index[v]) abrirDetalle(v);
  if (c === 'ptab' && st.sel) { st.ptab = v; renderDetalle(); }
  if (c === 'turnos-editar' && st.sel) { st.ptab = 'turnos'; st.psub = 'editar'; renderDetalle(); }
  if (c === 'turno-nuevo') openTurnoNuevo(v || 'semanal');
  if (c === 'renombrar') openNombre('renombrar');
  if (c === 'sub') openNombre('sub');
  if (c === 'desactivar') openConfirmar();
  if (c === 'opciones') $('#opciones').open = true;
}
</script>
